name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode sumber
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ekstrak proyek
        run: |
          mkdir project
          unzip -q CatatanKeuangan-Siap-Build-Online.zip -d project

      - name: Bangun APK
        run: gradle -p project assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: CatatanKeuangan-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
