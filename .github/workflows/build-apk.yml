name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Bangun APK Catatan Keuangan
    runs-on: ubuntu-latest

    steps:
      # Mengambil kode dari repository
      - name: Ambil kode sumber
        uses: actions/checkout@v4

      # Menyiapkan Java 17
      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Menyiapkan Android SDK
      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # Memasang Android SDK yang dibutuhkan
      - name: Pasang komponen Android
        run: |
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"

      # Menyiapkan Gradle
      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Mengekstrak kode sumber
      - name: Ekstrak proyek
        run: |
          mkdir -p project
          unzip -o CatatanKeuangan-Siap-Build-Online.zip -d project

      # Memeriksa struktur proyek
      - name: Periksa proyek
        run: |
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts
          echo "Struktur proyek ditemukan"

      # Memperbaiki target Java menjadi 17
      - name: Perbaiki konfigurasi Java
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("project/app/build.gradle.kts")
          content = file.read_text()

          if "compileOptions {" not in content:
              content = content.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """,
                  1
              )

          file.write_text(content)

          print("Konfigurasi Java:")
          print(file.read_text())
          PY

      # Memastikan konfigurasi Java sudah benar
      - name: Periksa target Java
        run: |
          grep -A 4 "compileOptions" \
            project/app/build.gradle.kts

      # Membuat APK
      - name: Bangun APK
        run: |
          gradle \
            -p project \
            --no-daemon \
            assembleDebug

      # Menyimpan APK agar dapat diunduh
      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: CatatanKeuangan-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
