name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Bangun APK Catatan Keuangan
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode sumber
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Pasang komponen Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ekstrak proyek
        run: |
          mkdir -p project
          unzip -o CatatanKeuangan-Siap-Build-Online.zip -d project

      - name: Periksa proyek
        run: |
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

      - name: Samakan target Java dan Kotlin
        run: |
          cat > jvm-target.init.gradle <<'EOF'
          allprojects {
              tasks.withType(
                  org.gradle.api.tasks.compile.JavaCompile
              ).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }

              tasks.withType(
                  org.jetbrains.kotlin.gradle.tasks.KotlinCompile
              ).configureEach {
                  kotlinOptions.jvmTarget = "17"
              }
          }
          EOF

      - name: Bangun APK
        run: |
          gradle -I jvm-target.init.gradle \
            -p project assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: CatatanKeuangan-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
